services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sendtec
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sendtec}
      POSTGRES_DB: sendtec
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sendtec"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sendtec:${DB_PASSWORD:-sendtec}@db:5432/sendtec
      # dentro do container a aplicação sempre ouve na 3000; PORT do .env só define a porta do servidor
      PORT: "3000"
      UPDATES_DIR: /updates
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - uploads:/data/uploads
      - updates:/updates

  # Backup diário do banco: guarda os últimos BACKUP_KEEP_DAYS dias em ./backups
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: sendtec
      PGPASSWORD: ${DB_PASSWORD:-sendtec}
      PGDATABASE: sendtec
      BACKUP_HOUR: ${BACKUP_HOUR:-03}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${BACKUP_TZ:-<-03>3} # horário de Brasília (formato POSIX, não depende de tzdata)
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Backup diário às $${BACKUP_HOUR}h, mantendo $${BACKUP_KEEP_DAYS} dias"
        while true; do
          if [ "$$(date +%H)" = "$${BACKUP_HOUR}" ] && [ ! -f "/backups/sendtec-$$(date +%F).sql.gz" ]; then
            pg_dump --no-owner | gzip > "/backups/sendtec-$$(date +%F).sql.gz.tmp" \
              && mv "/backups/sendtec-$$(date +%F).sql.gz.tmp" "/backups/sendtec-$$(date +%F).sql.gz" \
              && echo "Backup criado: sendtec-$$(date +%F).sql.gz"
            find /backups -name 'sendtec-*.sql.gz' -mtime +$${BACKUP_KEEP_DAYS} -delete
          fi
          sleep 600
        done

  # Atualização pela tela (Configurações > Atualizações). Só este serviço acessa o Docker do servidor;
  # a pasta do Sendtec é montada no mesmo caminho para o docker compose funcionar daqui de dentro.
  updater:
    image: docker:27-cli
    restart: unless-stopped
    working_dir: ${PWD}
    environment:
      REPO_DIR: ${PWD}
      UPDATES_DIR: /updates
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}:${PWD}
      - updates:/updates
    entrypoint: ["/bin/sh", "${PWD}/updater/updater.sh"]

volumes:
  pgdata:
  uploads:
  updates:
